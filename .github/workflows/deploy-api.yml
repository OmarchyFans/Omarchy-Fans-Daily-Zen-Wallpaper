name: deploy-api
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: skip without Cloudflare secrets
        if: env.CF_READY != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set on this repository; nothing deployed."
      - uses: actions/setup-node@v4
        if: env.CF_READY == 'true'
        with:
          node-version: 22
      - name: create the database once, apply the schema, deploy
        if: env.CF_READY == 'true'
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 create omarchy-fans-zen-ratings >/dev/null 2>&1 || true
          id=$(npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name == "omarchy-fans-zen-ratings") | .uuid')
          test -n "$id"
          sed -i "s/\"database_id\": \"DATABASE_ID\"/\"database_id\": \"$id\"/" wrangler.jsonc
          npx --yes wrangler@4 d1 execute omarchy-fans-zen-ratings --remote --file schema.sql
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          curl -fsS --max-time 15 "$url/v1/health" | grep -q '"ok":true'
          git checkout -- wrangler.jsonc
          echo "RATINGS_API=$url" >> "$GITHUB_ENV"
          echo "Ratings API: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: tell every install where the API is (catalog.json on main)
        if: env.CF_READY == 'true'
        run: |
          set -euo pipefail
          if [[ $(jq -r '.ratings_api // ""' catalog.json) == "$RATINGS_API" ]]; then echo "catalog.json already names $RATINGS_API"; exit 0; fi
          jq --arg u "$RATINGS_API" '.ratings_api = $u' catalog.json > catalog.tmp && mv catalog.tmp catalog.json
          git config user.name modpunk
          git config user.email 27315771+modpunk@users.noreply.github.com
          git add catalog.json
          git commit -m "catalog: ratings API at $RATINGS_API"
          git pull --rebase origin main
          git push origin HEAD:main
